# Render blueprint for Vorza. Free tiers only.
#
# Why this file exists: the deploy was previously configured by hand in the
# Render dashboard, which is why the data loss documented in HANDOVER.md was not
# visible to anyone reading the repo. A blueprint makes the deploy reproducible
# and reviewable.
#
# Apply: Render dashboard -> Blueprints -> New Blueprint Instance -> point at
# this repo, then set the secret values listed in docs/MANUAL_STEPS.md.
#
# Two facts that shape this file, both checked against vendor docs on
# 2026-10-05 rather than assumed:
#
# 1. Render free web services have NO persistent disk. It is wiped on every
#    restart, redeploy and instance move. That is why connected repositories
#    kept disappearing (HANDOVER.md:51-62). The only fix is an external
#    `DATABASE_URL`.
#
# 2. Render's own free Postgres is NOT a substitute. Free Render Postgres
#    expires 30 days after *creation* (not after inactivity -- there is a
#    14-day grace period, then the database and all its data are deleted), it is
#    capped at 1 GB, and an account may only have one. A 30-day data-loss clock
#    is worse than an ephemeral disk, because it looks durable right up until
#    it is not.
#
# So this blueprint deliberately declares NO `databases:` block. Point
# `DATABASE_URL` at Neon (free, no expiry) instead. Neon Free gives
# 100 CU-hours/project/month, 1 GB storage, 5 GB egress and scale-to-zero after
# 5 minutes, and exceeding a limit suspends compute rather than deleting data.
# See docs/MANUAL_STEPS.md for the click-by-click.

services:
  - type: web
    name: vorza-api
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /openapi.json
    envVars:
      # Neon pooled connection string, pasted by hand. Must start with
      # postgresql:// -- app/core/config.py rewrites the scheme to
      # postgresql+psycopg:// and psycopg[binary] is already a main dependency.
      #
      # Use the POOLED URI if Neon offers one. Render free has ~30s outbound
      # timeouts and the backend opens a pool per process, so a direct
      # (non-pooled) connection is the more likely thing to fall over.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # GitHub OAuth app credentials. Set by hand -- see MANUAL_STEPS.md.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Shared secret for the PR webhook HMAC. Set by hand. The webhook
      # receiver is fail-closed: with this unset it returns 503 rather than
      # accepting unsigned payloads.
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # Optional. With no key the orchestrator skips AI review and logs an
      # explicit warning instead of failing the run. Any OpenAI-compatible
      # provider works: set OPENAI_BASE_URL to its /v1 base (e.g. Groq
      # https://api.groq.com/openai/v1) and OPENAI_MODEL to its model id.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_BASE_URL
        sync: false
      # Must match the frontend origin exactly: CORS here is an explicit
      # allowlist, and this also builds GITHUB_OAUTH_CALLBACK_URL as
      # "{FRONTEND_HOST}/login". Update it to the new Vercel URL before
      # deploying.
      - key: FRONTEND_HOST
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

    # Docker is the only deploy path that has been verified to work: the repo
    # has a Dockerfile, and CI builds it on every push to master. Render's
    # native Python runtime resolves dependencies from a requirements.txt that
    # this repo does not have (it uses pyproject.toml).
    #
    # The context is ./backend because that is where the Dockerfile and
    # alembic.ini live; the paths below are relative to the context.
    dockerContext: ./backend
    dockerfilePath: ./Dockerfile
    # Run migrations before the app takes traffic. `preDeployCommand` below is
    # the primary hook, but a service created by hand before this blueprint
    # existed does not honour it, so the runtime command applies pending
    # migrations itself. Both paths are idempotent: `alembic upgrade head` on
    # an already-current database is a no-op, and schema.py keeps a fresh
    # database stamped so the two never collide.
    dockerCommand: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT"

    # `preDeployCommand` runs against the *new* release before it takes
    # traffic, so a failing migration stops the deploy instead of booting an
    # app that cannot serve. Without it, migrations and the new code race.
    #
    # Safe to run on every deploy precisely because app/core/schema.py stamps a
    # freshly created database and then hands control to Alembic, so an
    # idempotent `alembic upgrade head` never collides with `create_all`.
    preDeployCommand: alembic upgrade head

    # Uncomment to keep the container's writable layer small. Analysis clones
    # repos to disk, so this needs a real volume to be useful -- and free
    # services cannot have one. On the free tier the checkouts go to the
    # container's ephemeral layer and are lost on restart, which is acceptable:
    # only the analysis results are persisted, not the clones. See the disk
    # notes in docs/MANUAL_STEPS.md.
    # disk:
    #   name: vorza-checkouts
    #   mountPath: /var/data
    #   sizeGB: 1