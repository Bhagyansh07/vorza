name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `--group dev`, not `.[dev]`: the dev tools live in a PEP 735
          # dependency-group, and `.[dev]` resolves to an extra that does not
          # exist, leaving ruff/pytest/mypy uninstalled.
          pip install -e . --group dev
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy app
      - name: Test (pytest + coverage)
        # Gate is 60%. Measured total is 69.5% (1725 statements), so there is
        # headroom, but the gate was deliberately not raised: a higher bar that
        # then gets lowered to go green is worse than a bar that reflects what
        # the suite actually protects. Raise it when the suite grows into it.
        #
        # This step was previously failing because pytest-cov was not installed,
        # not because coverage was below the bar.
        run: |
          python -m pytest tests --cov=app --cov-report=term-missing --cov-fail-under=60
        timeout-minutes: 8

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
        timeout-minutes: 10

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: vorza/backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: vorza/frontend:ci
        timeout-minutes: 10
