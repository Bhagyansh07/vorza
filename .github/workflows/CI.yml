name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here publishes or pushes: the two build jobs only read the checkout,
# and the docker job builds without pushing (`push: false`). The default token
# permission is read-write over the whole repository, which this workflow has
# no use for.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Job-level ceiling. The step timeouts below bound the individual slow
    # steps; this bounds everything in between -- a stalled checkout, an
    # install waiting on a locked runner -- which no step timeout can see.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `--group dev`, not `.[dev]`: the dev tools live in a PEP 735
          # dependency-group, and `.[dev]` resolves to an extra that does not
          # exist, leaving ruff/pytest/mypy uninstalled.
          pip install -e . --group dev
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy app
      - name: Test (pytest + coverage)
        # Gate is 60%. The exact measured total is whatever this job prints
        # (`term-missing`); do not hard-code a percentage in docs, they drift.
        # The gate was deliberately kept at 60 rather than raised to the current
        # value: a higher bar that then gets lowered to go green is worse than a
        # bar that reflects what the suite actually protects. Raise it when the
        # suite grows into it.
        #
        # This step once failed silently because pytest-cov was not installed,
        # not because coverage was below the bar.
        run: |
          python -m pytest tests --cov=app --cov-report=term-missing --cov-fail-under=60
        timeout-minutes: 8

  frontend:
    runs-on: ubuntu-latest
    # Observed around a minute warm; the ceiling covers the gap between steps.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        # `postbuild` runs the bundle-size gate (check-bundle-size.mjs) against
        # the committed baseline: initial JS gzip > +5% fails the build (D3).
        run: npm run build
        timeout-minutes: 10

  docker-build:
    runs-on: ubuntu-latest
    # Two image builds on a cold cache; 20 minutes is headroom over the 10 the
    # slow step already allows.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: vorza/backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: vorza/frontend:ci
        timeout-minutes: 10
